<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <title>Wisuba</title>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        karla: ['Karla'],
                        ssp: ['"Source Sans 3"'],
                    },
                    fontSize: {
                        'px45': '45px',
                        'px22': '22px',
                        'px14': '14px',
                    },
                    colors: {
                        link: '#ff8682',
                        button: '#223d5b',
                        'login-with-button': '#8dd3bb',
                    }
                }
            }
        };
    </script>
</head>
<body>
    <div class="p-10 md:p-28 flex flex-col lg:flex-row">
        <!-- Left Section -->
        <div class="mr-auto w-full lg:w-3/4">
            <!-- Logo -->
            <div class="pt-5">
                <img src="assets/img/wisuba-logo.png" alt="wisuba-logo.png">
            </div>
            <!-- Form Section -->
            <div class="pt-9">
                <h1 class="font-karla font-semibold text-px45">Login</h1>
                <p class="font-ssp font-regular text-px22 text-gray-600">Login to access your account</p>
            </div>
            <!-- Login Form -->
            <div class="pt-12">
                <form action="">
                    <div class="flex flex-col gap-6">
                        <div class="relative w-4/5">
                            <input type="text" name="email" id="email" class="w-full border border-gray-400 pl-4 py-2 rounded font-ssp font-regular text-px22">
                            <label for="email" class="absolute -top-3 left-4 text-gray-500 bg-white px-1 font-ssp text-px14">Email</label>
                        </div>
                        <div class="relative w-4/5">
                            <input type="password" name="password" id="password" class="w-full border border-gray-400 pl-4 py-2 rounded font-ssp font-regular text-px22">
                            <label for="password" class="absolute -top-3 left-4 text-gray-500 bg-white px-1 font-ssp text-px14">Password</label>
                        </div>
                    </div>
                    <div class="pt-6 flex w-4/5 justify-between">
                        <div class="flex items-center">
                            <input type="checkbox" id="remember" name="remember" class="mr-2">
                            <label for="remember" class="font-ssp font-regular text-px14">Remember me</label>
                        </div>
                        <a href="url" class="font-ssp font-regular text-px14 text-link">Forgot Password</a>
                    </div>
                </form>
            </div>
            <!-- Submit Button -->
            <div class="py-10">
                <button type="button" class="text-white rounded-full bg-button w-4/5 py-2 font-ssp font-regular text-xl">Login</button>
                <p class="text-center w-4/5 pt-2 font-ssp font-regular text-px14">Don't have an account? <a href="url" class="text-link">Sign up</a></p>
            </div>
            <!-- Or Login With Section -->
            <div class="w-4/5 flex items-center gap-4">
                <div class="flex-1 h-px bg-black opacity-25"></div>
                <p class="font-ssp text-px14 text-gray-400">Or login with</p>
                <div class="flex-1 h-px bg-black opacity-25"></div>
            </div>
            <div class="pt-10 flex gap-4 w-4/5">
                <button type="button" class="flex-1 px-6 py-4 rounded border border-login-with-button flex justify-center items-center">
                    <img src="assets/img/facebook.png" alt="facebook.png">
                </button>
                <button type="button" class="flex-1 px-6 py-4 rounded border border-login-with-button flex justify-center items-center">
                    <img src="assets/img/google.png" alt="google.png">
                </button>
                <button type="button" class="flex-1 px-6 py-4 rounded border border-login-with-button flex justify-center items-center">
                    <img src="assets/img/apple.png" alt="apple.png">
                </button>
            </div>
        </div>
        <!-- Right Section -->
        <div class="hidden lg:block flex-shrink-0">
            <img class="max-w-full max-h-screen object-cover rounded-lg" src="assets/img/wisuba-group-photo.png" alt="wisuba-group-photo.png">
        </div>
    </div>
</body>
</html>
